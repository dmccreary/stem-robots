<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Swarm Robot State Machine using Mermaid</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: Arial, Helvetica, sans-serif; }
        main { display: block; width: 100%; height: 470px; border: 1px solid silver; }
        .toolbar { height: 46px; display: flex; align-items: center; gap: 6px; padding: 0 8px;
                   background: white; border-bottom: 1px solid silver; flex-wrap: nowrap; }
        .toolbar .lbl { font-size: 15px; font-weight: bold; white-space: nowrap; }
        .toolbar button { font-size: 14px; padding: 5px 9px; border: 1px solid #999; border-radius: 4px;
                          background: whitesmoke; cursor: pointer; white-space: nowrap; }
        .toolbar button.active { background: olivedrab; color: white; border-color: darkolivegreen; }
        .toolbar .state { margin-left: auto; font-size: 15px; white-space: nowrap; }
        .toolbar .state b { padding: 2px 8px; border-radius: 10px; color: white; }
        .row { display: flex; height: calc(100% - 46px); }
        .diagram-panel { width: 62%; height: 100%; background: aliceblue; padding: 6px;
                         display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .diagram-panel svg { max-width: 100%; max-height: 100%; height: auto; }
        .info-panel { width: 38%; height: 100%; background: #f8f9fa; border-left: 1px solid silver;
                      padding: 8px 10px; overflow: hidden; }
        .card { background: white; border: 1px solid #cbd5e1; border-radius: 6px; padding: 7px 9px; margin-bottom: 8px; }
        .card h3 { font-size: 15px; color: darkolivegreen; margin-bottom: 6px; }
        .events { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .events button { font-size: 13px; padding: 5px 4px; border: 1px solid #999; border-radius: 4px;
                         background: whitesmoke; cursor: pointer; }
        .events button.hint { border-color: olivedrab; background: #eef5e0; }
        .events button.danger { border-color: crimson; }
        #details, #quiz { font-size: 14px; line-height: 1.4; color: #333; }
        #details b, #quiz b { color: darkolivegreen; }
        #quiz .scenario { font-style: italic; margin-bottom: 6px; }
        #quiz .ok { color: darkgreen; font-weight: bold; }
        #quiz .no { color: crimson; font-weight: bold; }
        #quiz button { font-size: 13px; padding: 4px 8px; margin-top: 6px; }
        .node, .edgeLabel, .flowchart-link { cursor: pointer; }
        @media (max-width: 620px) {
            .toolbar { gap: 4px; padding: 0 4px; }
            .toolbar .lbl { display: none; }
            .toolbar button { font-size: 12px; padding: 4px 5px; }
            .toolbar .state { font-size: 12px; }
            .row { flex-direction: column; }
            .diagram-panel { width: 100%; height: 50%; }
            .info-panel { width: 100%; height: 50%; border-left: none; border-top: 1px solid silver;
                          padding: 5px 6px; display: flex; gap: 6px; }
            .info-panel .card { flex: 1; margin-bottom: 0; padding: 5px 6px; }
            .card h3 { font-size: 13px; }
            .events { grid-template-columns: 1fr; gap: 3px; }
            .events button { font-size: 11px; padding: 3px 2px; }
            #details, #quiz { font-size: 11px; line-height: 1.3; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script src="swarm-robot-state-machine.js"></script>
</head>
<body>
    <main></main>
</body>
</html>
